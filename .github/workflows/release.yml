name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v-prefixed tag to publish"
        required: true
        default: "v0.2.1"

permissions:
  contents: write
  id-token: write

jobs:
  windows-codex-gate:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:plugin
      - run: npm run test:stability
      - run: npm run benchmark:routing-light
      - run: npm run test:package

  release:
    needs: windows-codex-gate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run validate:plugin
      - run: npm run test:stability
      - run: npm run test:package
      - run: npm run sbom
      - run: mkdir -p artifacts
      - run: npm pack --workspace packages/cli --pack-destination artifacts
      - run: sha256sum artifacts/*.tgz thearchy.spdx.json > SHA256SUMS
      - name: Verify stable version and trusted publishing client
        run: |
          test "${RELEASE_TAG#v}" != "$RELEASE_TAG"
          test "$(node -p "require('./packages/cli/package.json').version")" = "${RELEASE_TAG#v}"
          node -e "const {execFileSync}=require('node:child_process'); const [major,minor]=execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(major<11||(major===11&&minor<5)) process.exit(1)"
      - name: Publish package
        run: npm publish --workspace packages/cli --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: false
          files: |
            artifacts/*.tgz
            thearchy.spdx.json
            SHA256SUMS
